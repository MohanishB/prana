name: prana
description: PRANA health, wellness, workshops and masterclass mobile application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^14.8.1
  intl: ^0.19.0
  url_launcher: ^6.3.2
  youtube_player_iframe: ^5.2.2
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  video_player: ^2.9.5
  webview_flutter: ^4.13.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
