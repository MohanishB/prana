name: prana
description: PRANA health, wellness, workshops and masterclass mobile application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  go_router: ^18.1.4
  intl: ^0.20.3
  url_launcher: ^6.3.2
  youtube_player_iframe: ^6.0.2
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.5
  open_filex: ^5.0.0
  video_player: ^2.9.5
  webview_flutter: ^4.13.0
  image_picker: ^1.1.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  razorpay_flutter: ^1.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/images/
